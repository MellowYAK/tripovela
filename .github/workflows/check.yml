name: Source checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, dom, fileinfo, curl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python bin/check-release.py
      - run: find src views public bin -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: find public/assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: python -m compileall -q bin
